name: Compiler CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Install Rust with formatting and lint tools
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets without warnings
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        profile: [test]
        include:
          - os: ubuntu-24.04
            profile: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run unit, integration and documentation tests
        run: cargo test --workspace --profile ${{ matrix.profile }} --locked --offline

  native:
    name: Native and managed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      CAVO_NATIVE_REQUIRED: "1"
      CAVO_MANAGED_REQUIRED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Checkout pinned LLAM release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Feralthedogg/LLAM
          ref: f0ea03c87be4a880b88a3b03bec48334762eb3d4 # 3.0.0
          path: target/cavo-ci/llam
          persist-credentials: false
          clean: false
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl cmake ninja-build python3 zstd liburing-dev libffi-dev libedit-dev libxml2-dev zlib1g-dev libzstd-dev
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Prepare LLVM and the required LLAM SDK
        shell: bash
        run: bash .github/scripts/native-check.sh prepare
      - name: Test native code generation at O0 and O2
        shell: bash
        run: bash .github/scripts/native-check.sh check
